<?xml version="1.0" encoding="UTF-8"?>
<!--
  Visora app icon — 1024 × 1024
  ─────────────────────────────
  R57: Dawn Horizon. A rising sun above the horizon, in the same
  cosmic-warm palette as the in-app surfaces. Conveys morning ritual +
  becoming, the core daily moment Visora is built around.

  Replaced the previous "V + dot on dawn gradient" design after user
  testing — earlier draft variants live at
  `Manifestation App - Claude Design/icon-variants/`.

  Palette pulls from the in-app cosmic-warm register so the icon feels
  continuous with the rest of the brand:
    cosmic-a (#2A1F15)   — deep ground (corners)
    terra (#C06848)       — warm dawn (mid-sky)
    amber (#D89A5A)        — luminous (sun core)
    cream (#FAF6EF)        — horizon line accent

  To regenerate the PNG (Apple requires 1024×1024 RGB, no alpha):
    qlmanage -t -s 1024 -o /tmp mobile/assets/images/icon.svg
    ffmpeg -y -i /tmp/icon.svg.png -pix_fmt rgb24 mobile/assets/images/icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgDawn" cx="50%" cy="100%" r="100%">
      <stop offset="0%"  stop-color="#E8A878" />
      <stop offset="35%" stop-color="#C06848" />
      <stop offset="70%" stop-color="#4d2f1c" />
      <stop offset="100%" stop-color="#2A1F15" />
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE5C8" />
      <stop offset="55%" stop-color="#F5B584" />
      <stop offset="100%" stop-color="#C06848" />
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFD3A0" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#FFD3A0" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFD3A0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background (Apple rounds the corners) -->
  <rect width="1024" height="1024" fill="url(#bgDawn)" />

  <!-- Subtle warm halo behind the sun -->
  <circle cx="512" cy="600" r="450" fill="url(#sunHalo)" />

  <!-- Horizon line — cream, faint -->
  <rect x="80" y="606" width="864" height="3" fill="#FAF6EF" opacity="0.35" />

  <!-- Sun (semicircle sitting on horizon) -->
  <path
    d="M 232 606
       A 280 280 0 0 1 792 606
       Z"
    fill="url(#sunGlow)"
  />
</svg>
